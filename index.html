  <!-- EDIT: page title and Google search description -->

  <!-- EDIT: link preview (WhatsApp, LinkedIn etc.) -->

<body>

  <header class="site-header">
    <a class="logo" href="/">WeGoGym</a>
    <a class="header-cta" href="/waitlist/">Join the waitlist</a>
  </header>

  <main>
    <section class="panels">

      <!-- PANEL 1: cyclists photo, tall crop on phones, wide 16:9 crop from 768px up -->
      <article class="panel">
        <picture>
          <source media="(min-width: 768px)" srcset="images/panel-1-wide.webp" width="1240" height="698">
          <img src="images/panel-1-tall.webp" alt="A group of cyclists riding together along a park road, with deer grazing behind them" width="894" height="1490">
        </picture>
        <div class="panel-content">
          <h2>Find People<br>Find Health<br>Find Community</h2>
          <a class="panel-link" href="/waitlist/">Join the waitlist</a>
        </div>
      </article>

      <!-- PANEL 2: the photo that used to be panel 1 (images/panel-1.webp) -->
      <article class="panel">
        <img src="images/panel-1.webp" alt="People dancing together in a park" width="2400" height="1350" loading="lazy">
        <div class="panel-content">
          <h2>Train off-peak<br>Train for less</h2>
        <div class="panel-actions"><a class="panel-link" href="/business-register/">Register your business</a><span class="panel-tag">Bookings coming soon</span></div>
        </div>
      </article>

      <!-- PANEL 3 -->
      <article class="panel">
        <img src="images/panel-3.webp" alt="Older men exercising on outdoor bars in a park" width="2400" height="1350" loading="lazy">
        <div class="panel-content">
          <h2>No subscriptions.</h2>
          <p>Something for anyone and everyone</p>
          <a class="panel-link" href="/waitlist/">Pre-register</a>
        </div>
      </article>

    </section>
  </main>

  <footer class="site-footer">
    <a href="mailto:hello@wegogym.club">hello@wegogym.club</a>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms of Use</a>
    <span>&copy; 2026 WeGoGym</span>
  </footer>
